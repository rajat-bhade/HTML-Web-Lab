<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM Practical</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <div class="container">

        <h1 id="heading">Welcome to JavaScript</h1>

        <p id="message">This is the original paragraph.</p>

        <img id="myImage"
             src="https://picsum.photos/300/180"
             alt="Sample landscape">

        <div class="controls">
            <button id="changeText">Change Text</button>
            <button id="changeColor">Change Color</button>
            <button id="toggleImage">Hide / Show Image</button>
            <button id="showDate">Show Date &amp; Time</button>
        </div>

        <p id="datetime" aria-live="polite"></p>

    </div>

</body>
</html>
